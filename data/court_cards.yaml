# RuneTarot — Court Cards
# Golden Dawn / Book T Correspondences
# 16 Court Cards: 4 Suits x 4 Court Positions
# GD uses Knight/Queen/Prince/Princess (not King/Queen/Knight/Page)
# Tetragrammaton: Yod-He-Vav-He(Final) = Knight-Queen-Prince-Princess

court_cards:
