# GD COLOR SCALES (Four Scales of Color)
# ═══════════════════════════════════════════

color_scales:
  king_scale:
    name: "King Scale (Atziluth)"
    description: "The Archetypal World — the highest, most spiritual expression. Used for the Spirit of the element."
    purpose: "Kether-level color, the pure spiritual emanation."
  queen_scale:
    name: "Queen Scale (Briah)"
    description: "The Creative World — the archangelic level. The formative blueprint."
    purpose: "Chokmah/Binah level color, the creative template."
  prince_scale:
    name: "Prince Scale (Yetzirah)"
    description: "The Formative World — the angelic level. The astral pattern."
    purpose: "Tiphareth level color, the pattern that takes form."
  princess_scale:
    name: "Princess Scale (Assiah)"
    description: "The Material World — the physical manifestation. The densest expression."
    purpose: "Malkuth level color, the materialised appearance."