# ═══════════════════════════════════════════
# ELEMENTAL DIGNITIES
# ═══════════════════════════════════════════

elemental_dignities:
  fire_fire:
    relationship: "friendly_excess"
    description: "Fire with Fire — excessively strong. Amplified to the point of burnout or obsession. Great energy but potentially unbalanced."
  water_water:
    relationship: "friendly_excess"
    description: "Water with Water — excessively receptive. Amplified emotion, deep intuition, but potentially stagnant or overwhelming."
  air_air:
    relationship: "friendly_excess"
    description: "Air with Air — excessively mental. Sharp intellect but potentially detached, over-analytical, or scattered."
  earth_earth:
    relationship: "friendly_excess"
    description: "Earth with Earth — excessively material. Stability but potentially rigid, materialistic, or stuck."
  fire_air:
    relationship: "friendly"
    description: "Fire with Air — mutually friendly. Both are active elements. Creative energy supported by intellect. Inspiration combined with communication."
  air_fire:
    relationship: "friendly"
    description: "Air with Fire — mutually friendly. Intellect supports creative impulse. Thought and will working in harmony."
  water_earth:
    relationship: "friendly"
    description: "Water with Earth — mutually friendly. Both are passive/receptive elements. Emotion supported by material foundation. Feeling grounded in practical reality."
  earth_water:
    relationship: "friendly"
    description: "Earth with Water — mutually friendly. Material form supported by emotional depth. The fertile soil receiving the rain."
  fire_water:
    relationship: "hostile"
    description: "Fire with Water — hostile/opposing. Will conflicts with feeling. Passion and emotion in tension. One must dominate — the stronger element prevails."
  water_fire:
    relationship: "hostile"
    description: "Water with Fire — hostile/opposing. Feeling conflicts with will. Emotion dampens passion. The element with more cards or stronger position dominates."
  air_earth:
    relationship: "hostile"
    description: "Air with Earth — hostile/opposing. Intellect conflicts with materiality. Thought and practicality in tension. Mind and body at odds."
  earth_air:
    relationship: "hostile"
    description: "Earth with Air — hostile/opposing. Materiality conflicts with intellect. Practical concerns limit thought. The body resists the mind."
  fire_earth:
    relationship: "neutral"
    description: "Fire with Earth — neither friendly nor hostile. Will acting upon matter. Creation meeting manifestation. Moderating influence."
  earth_fire:
    relationship: "neutral"
    description: "Earth with Fire — neutral. Matter receiving will. Material conditions shaped by creative force. Practical application of inspiration."
  water_air:
    relationship: "neutral"
    description: "Water with Air — neither friendly nor hostile. Emotion meeting intellect. Feeling informing thought. Rain and wind together."
  air_water:
    relationship: "neutral"
    description: "Air with Water — neutral. Intellect meeting emotion. Thought shaped by feeling. The wind over the waters."

